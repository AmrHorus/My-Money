name: flousi_app
description: "فلوسي | My Money - Personal money organization application"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Date & Time
  intl: ^0.19.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.68.0

  # Icons
  cupertino_icons: ^1.0.8

  # Shared Preferences
  shared_preferences: ^2.2.3

  # HTTP Client
  http: ^1.2.0

  # JSON Serialization
  json_annotation: ^4.8.1

  # UUID for unique IDs
  uuid: ^4.3.3

  # Connectivity
  connectivity_plus: ^5.0.2

  # FFI for Rust integration (optional, for future)
  # ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
