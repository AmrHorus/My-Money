[package]
name = "rust-security"
version = "0.1.0"
edition = "2021"
description = "Security and cryptography utilities for My-Money application"

[lib]
crate-type = ["cdylib", "rlib"]
name = "rust_security"

[dependencies]
# Cryptography
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Random generation
rand = "0.8"
rand_chacha = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

# Hex encoding
hex = "0.4"

# Zeroize sensitive data
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# FFI support for Flutter integration
ffi-support = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "crypto_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
